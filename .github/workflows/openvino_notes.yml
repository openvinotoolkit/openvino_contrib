name: OpenVINO Notes Android

on:
  pull_request:
    paths:
      - "modules/openvino-notes/**"
      - "scripts/openvino_notes_gradle.sh"
      - ".github/workflows/openvino_notes.yml"
  push:
    branches:
      - master
      - "an/**"
    paths:
      - "modules/openvino-notes/**"
      - "scripts/openvino_notes_gradle.sh"
      - ".github/workflows/openvino_notes.yml"

permissions:
  contents: read

jobs:
  android:
    name: Architecture, tests, and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENVINO_NOTES_STATE_ROOT: ${{ github.workspace }}/builds/android/openvino-notes
      GRADLE_USER_HOME: ${{ github.workspace }}/builds/android/openvino-notes/gradle-user-home
      ANDROID_HOME: ${{ github.workspace }}/builds/android/sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/builds/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: modules/openvino-notes/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run architecture, unit, and build gates
        run: >-
          ./scripts/openvino_notes_gradle.sh
          checkArchitecture
          test
          testDebugUnitTest
          :app:assembleDebug
          -PopenvinoAndroidAbi=x86_64

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openvino-notes-failure-reports
          path: |
            builds/android/openvino-notes/gradle/**/reports/**
            builds/android/openvino-notes/gradle/**/test-results/**
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openvino-notes-debug-apk
          path: builds/android/openvino-notes/gradle/app/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
